<!DOCTYPE html>
<html>

<head>
    <title>My Assignment Marks</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/assignments_student.css') }}">
</head>

<body>

    <h1>My Assignment Marks</h1>

    <a href="{{ url_for('student_dashboard') }}">
        Back to Dashboard
    </a>

    <hr>

    {% if assignment_data %}

    <table border="1" cellpadding="8">

        <tr>
            <th>Subject</th>
            <th>Type</th>
            <th>Assignment No</th>
            <th>Marks</th>
        </tr>

        {% for row in assignment_data %}

        <tr>
            <td>{{ row.Subject_Name }}</td>
            <td>{{ row.Subject_Type }}</td>
            <td>{{ row.Assignment_No }}</td>
            <td>{{ row.Marks }}</td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

        <h3>No assignment marks available.</h3>

    {% endif %}

</body>

</html>
